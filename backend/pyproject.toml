[project]
name = "omoi-backend"
version = "0.0.0"
description = "omoi Backend — Cloud Run Deploy Unit (FastAPI)"
requires-python = ">=3.13,<3.14"
dependencies = [
    # 【仮決定】FastAPI 0.139系 / Pydantic（AGENTS.md §6）
    "fastapi~=0.139.0",
    "google-genai~=2.19",
    # 非同期化: Job Store(Firestore) / Asset・Job入力Storage(GCS) / 実行基盤(Cloud Tasks)。
    # 既定Backendは memory / local / inline なので、これらは job_store_backend=firestore 等を
    # 明示的に有効化するまで実際には呼ばれない（AGENTS.md: 単独でFIXしない範囲の配慮）。
    "google-cloud-firestore>=2.16,<3",
    "google-cloud-storage>=2.16,<3",
    "google-cloud-tasks>=2.16,<3",
    "numpy~=2.3",
    "onnxruntime~=1.24",
    "pillow~=12.0",
    "pydantic~=2.13",
    "pydantic-settings~=2.15",
    # full-resolution binary Maskの8近傍hole fillを品質非変更で高速化する。
    "scipy~=1.16",
    # multipart/form-data の受け口に必要
    "python-multipart~=0.0.32",
    "uvicorn[standard]~=0.52",
]

[dependency-groups]
dev = [
    "httpx~=0.28",
    "pytest~=9.0",
    "ruff~=0.16",
    # contracts/ の正本Schemaに対して生成結果を突き合わせるテスト用
    "jsonschema~=4.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# backend/ai は Backend と同一実行環境の内部Module（独立Serviceにしない）
packages = ["app", "ai"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
